# Orca worktree hooks. Setup links the shared KSP install into the new worktree
# (so the plugin builds without KSP_ROOT), copies local agent settings, restores
# packages and runs the Core tests so a lane starts from a known-green tree.
scripts:
  setup: |
    bash "$ORCA_WORKTREE_PATH/scripts/worktree-setup.sh" "$ORCA_ROOT_PATH" "$ORCA_WORKTREE_PATH"
  archive: |
    true
