// Kerblox block physics. Each KERBLOX_BLOCK sets density (t/m^3) and/or solid
// (contributes mass and collision) for blocks matched by name:
//
//   name = minecraft:stone    an exact block id (block-state properties are ignored)
//   name = mekanism:*         every block in a namespace
//   name = *                  every block no other rule covers
//
// Each value comes from the most specific rule that sets it. To change values
// without editing this file, add KERBLOX_BLOCK nodes in another cfg: when two
// nodes give the same name, the one KSP loads later wins (load order between
// files is unverified, so prefer distinct names or edit here). Values are
// game-balanced, not realistic. Changes apply on the next game start.

// Default for any block without a rule, e.g. blocks from Minecraft mods.
KERBLOX_BLOCK
{
	name = *
	density = 0.25
	solid = true
}

KERBLOX_BLOCK
{
	name = minecraft:stone
	density = 0.30
	solid = true
}

KERBLOX_BLOCK
{
	name = minecraft:oak_planks
	density = 0.10
	solid = true
}

KERBLOX_BLOCK
{
	name = minecraft:iron_block
	density = 0.60
	solid = true
}

KERBLOX_BLOCK
{
	name = minecraft:glass
	density = 0.20
	solid = true
}

KERBLOX_BLOCK
{
	name = minecraft:white_wool
	density = 0.02
	solid = true
}
