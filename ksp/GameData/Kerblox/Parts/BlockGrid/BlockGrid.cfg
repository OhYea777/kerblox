// Kerblox block grid: one part whose shape is a voxel grid of Minecraft-style blocks.
// Geometry, colliders, mass, CoM and drag are all generated by ModuleBlockGrid.
PART
{
	name = kerbloxBlockGrid
	module = Part
	author = OhYea777

	// KSP will not compile a part without a MODEL, and we have no Unity-built .mu.
	// Borrow a tiny stock model; ModuleBlockGrid deletes it at load time.
	MODEL
	{
		model = Squad/Parts/Structural/structuralMicronode/model
	}
	// The default rescaleFactor is 1.25, which would scale our generated mesh too.
	rescaleFactor = 1
	scale = 1

	// Placeholder positions for the default 4x8x4 grid at 0.625 m blocks (5 m tall).
	// ModuleBlockGrid moves them onto the actual top/bottom block faces.
	// format: x, y, z, dirX, dirY, dirZ, size
	node_stack_top = 0.0, 2.5, 0.0, 0.0, 1.0, 0.0, 2
	node_stack_bottom = 0.0, -2.5, 0.0, 0.0, -1.0, 0.0, 2
	attachRules = 1,1,1,1,0

	TechRequired = start
	entryCost = 0
	cost = 500
	category = Structural
	subcategory = 0
	title = Kerblox Block Grid
	manufacturer = Kerblox
	description = A rocket section made of blocks. Mined, not machined.
	tags = kerblox block voxel minecraft cube

	// Total mass = this frame mass + block mass reported by ModuleBlockGrid.
	mass = 0.01
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 2
	crashTolerance = 12
	breakingForce = 200
	breakingTorque = 200
	maxTemp = 2000
	bulkheadProfiles = size2

	MODULE
	{
		name = ModuleBlockGrid
		blockSize = 0.625
	}
}
